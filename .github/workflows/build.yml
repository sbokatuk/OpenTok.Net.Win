name: build

# Reusable only, like the sibling repositories' build.yml. pr.yml and release.yml decide the version
# and what to do with the result; also triggering on pull_request would run this whole pipeline
# twice for every push to a pull request — once at the beta version and once without one.
on:
  workflow_call:
    inputs:
      verify:
        description: >
          Whether to run the verification jobs — package validation, the sample builds, the
          Release link checks and the e2e suites. Pull requests leave it at true, and are the only
          place any of this runs. Releases pass false: the tagged commit was already verified on
          its pull request, so a tag packs and publishes and nothing more. The gate is the same
          input, with the same name and the same meaning, in every repository.
        required: false
        default: true
        type: boolean
      suffix:
        description: Optional prerelease suffix (e.g. beta.12.34) appended to the package's version.
        required: false
        type: string
        default: ''
permissions:
  contents: read

jobs:
  # The converter, on the cheapest runner there is.
  #
  # Separate from the Windows jobs on purpose. The I420 to BGRA arithmetic is the one part of this
  # repository with no Windows types in it, and it is also the part most able to be wrong without
  # looking wrong — a bad chroma stride or a full-range coefficient set produces a picture that is
  # merely slightly off. Keeping it runnable on Linux means it is verified in seconds on every push,
  # rather than behind a Windows runner and a Windows App SDK restore.
  converter:
    name: converter arithmetic (ubuntu)
    if: ${{ inputs.verify }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Test
        run: dotnet test tests/OpenTok.Net.Win.UnitTests --configuration Release

  pack:
    name: build and pack (windows)
    timeout-minutes: 30
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Three target frameworks, one SDK. Unlike the iOS and Android repositories there is no
      # per-band workload here — a -windows target framework needs only the Windows SDK reference
      # pack, which the .NET 10 SDK carries for net8, net9 and net10 alike. So no two-pass build and
      # no merge step.
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Pack
        shell: bash
        run: |
          s="${{ inputs.suffix != '' && format('-p:VersionSuffix={0}', inputs.suffix) || '' }}"
          dotnet pack src/OpenTok.Net.Win --configuration Release ${s} -o artifacts

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts

  # Proves the package a consumer restores actually carries what it claims, rather than what the
  # project file says it should. Runs on Linux because it only reads the .nupkg as a zip.
  package-tests:
    name: package contents
    if: ${{ inputs.verify }}
    timeout-minutes: 10
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts

      - name: Test
        run: dotnet test tests/OpenTok.Net.Win.PackageTests --configuration Release

  # The one that would catch a renderer that does not compile.
  #
  # Release rather than Debug, and against the packed .nupkg rather than a project reference, for
  # the same reason the sibling repositories do it: a project reference proves the source compiles,
  # not that the package a consumer restores resolves, brings its native payload along, and links.
  sample:
    name: WinUI sample against the packed package (Release)
    timeout-minutes: 30
    needs: pack
    if: ${{ inputs.verify }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts

      - name: Build the sample
        shell: bash
        run: |
          # Computed from the same two properties release.yml and pr.yml read, rather than scraped
          # out of a file name. The previous shape parsed `ls artifacts/*.nupkg` with a sed pattern,
          # which had two problems: the glob also matches the .snupkg sitting beside it, and the
          # pattern silently stopped substituting when the package was renamed — leaving v set to
          # the whole path and the build failing with "is not a valid version string".
          version="$(sed -n 's:.*<OpenTokVersion>\(.*\)</OpenTokVersion>.*:\1:p' Directory.Build.props | head -1)"
          revision="$(sed -n 's:.*<OpenTokBindingRevision>\(.*\)</OpenTokBindingRevision>.*:\1:p' Directory.Build.props | head -1)"
          v="${version}.${revision}${{ inputs.suffix != '' && format('-{0}', inputs.suffix) || '' }}"

          echo "building against ${v}"

          if [ ! -f "artifacts/OpenTok.Net.Win.${v}.nupkg" ]; then
            echo "::error::artifacts/OpenTok.Net.Win.${v}.nupkg does not exist — the pack job and this job disagree about the version"
            ls artifacts
            exit 1
          fi

          # x64 explicitly. OpenTok.Client's native payload has no arm64 build, and the package's
          # own build/OpenTok.Net.Win.targets fails the build rather than let that reach
          # runtime — so this also exercises that the guard permits the configuration it should.
          dotnet build samples/OpenTok.Sample.WinUI \
            --configuration Release \
            -r win-x64 --self-contained false \
            -p:OpenTokWinPackageVersion="${v}"

      # The renderer is useless if the SDK's native payload does not travel with it — that is the
      # failure this package exists downstream of, and it is invisible until the first frame.
      - name: Check the native payload reached the output
        shell: bash
        run: |
          out="$(find samples/OpenTok.Sample.WinUI/bin/Release -name 'opentok.dll' | head -1)"
          if [ -z "${out}" ]; then
            echo "::error::opentok.dll is missing from the sample's build output"
            exit 1
          fi
          echo "ok  ${out}"
